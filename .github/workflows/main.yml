name: "Build & Release"

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
    
jobs:
    # JOB 1: WINDOWS & ANDROID
    build-windows-android:
        name: Build Windows & Android
        runs-on: windows-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup-Java
              uses: actions/setup-java@v3.12.0
              with:
                distribution: 'oracle'
                java-version: '17'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Inno Setup
              run: choco install innosetup -y

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              shell: powershell
              run: |
                  $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
                  if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
                  $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
                  echo "VERSION=$ver" >> $env:GITHUB_ENV

            - name: Create keystore file
              run: |
                  $b64 = "${{ secrets.KEY_STORE }}"
                  $filename = "./android/voidmusic.jks"
                  $bytes =[Convert]::FromBase64String($b64)
                  [IO.File]::WriteAllBytes($filename, $bytes)
            
            - name: Create Keystore properties
              run: |
                  echo storePassword=\${{ secrets.STORE_PASSWORD }} > ./android/key.properties
                  echo keyPassword=\${{ secrets.KEY_PASSWORD }} >> ./android/key.properties
                  echo keyAlias=\${{ secrets.KEY_ALIAS }} >> ./android/key.properties
                  echo storeFile=voidmusic.jks >> ./android/key.properties


            - name: Build App files
              run: flutter build apk --release --target-platform android-arm64 --build-number ${{github.run_number}}

            - name: Verify Sign
              run: |
                  $buildToolsDir = Get-ChildItem "$env:ANDROID_HOME\build-tools" | Where-Object { $_.PSIsContainer } | Sort-Object Name -Descending | Select-Object -First 1
                  Write-Host "Using build tools version: $($buildToolsDir.Name)"
                  & "$($buildToolsDir.FullName)\apksigner.bat" verify build/app/outputs/flutter-apk/app-release.apk

            - name: Rename APK file
              shell: powershell
              run: |
                  Rename-Item -Path "build/app/outputs/flutter-apk/app-release.apk" -NewName "VoidMusic_v$env:VERSION+${{github.run_number}}_arm64-v8a.apk"

            - name: Build Windows App
              run: flutter build windows --release --build-number ${{github.run_number}}

            - name: Create build-number.txt file
              run: echo ${{github.run_number}} > build-number.txt

            - name: Create Inno Setup installer
              shell: powershell
              run: |
                  $env:VERSION = "${{ env.VERSION }}"
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVERSION=$env:VERSION windows/installer.iss
            
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: Release-Windows-Android
                path: |
                  build/app/outputs/flutter-apk/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a.apk
                  build/windows/x64/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.exe
                  build-number.txt

            - name: Create Release
              uses: ncipollo/release-action@v1
              with:
                artifacts: |
                  build/app/outputs/flutter-apk/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a.apk
                  build/windows/x64/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.exe
                  build-number.txt
                tag: v${{ env.VERSION }}+${{github.run_number}}
                token: ${{ secrets.GITHUB_TOKEN }}
                prerelease: true
                allowUpdates: true 


    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Linux Dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              run: |
                VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
                echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build Linux App
              run: flutter build linux --release --build-number ${{github.run_number}}

            - name: Compress Linux Build
              run: |
                tar -czf VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz -C build/linux/x64/release/bundle .

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: Release-Linux
                path: VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz

            - name: Publish Linux to Release
              uses: ncipollo/release-action@v1
              with:
                artifacts: VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz
                tag: v${{ env.VERSION }}+${{github.run_number}}
                token: ${{ secrets.GITHUB_TOKEN }}
                prerelease: true
                allowUpdates: true
                omitBodyDuringUpdate: true

    build-android-ubuntu:
        name: Build Android (Ubuntu)
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup-Java
              uses: actions/setup-java@v3.12.0
              with:
                distribution: 'oracle'
                java-version: '17'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              run: |
                VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
                echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Create keystore file
              run: |
                echo "${{ secrets.KEY_STORE }}" | base64 -d > ./android/voidmusic.jks

            - name: Create Keystore properties
              run: |
                echo storePassword=\${{ secrets.STORE_PASSWORD }} > ./android/key.properties
                echo keyPassword=\${{ secrets.KEY_PASSWORD }} >> ./android/key.properties
                echo keyAlias=\${{ secrets.KEY_ALIAS }} >> ./android/key.properties
                echo storeFile=voidmusic.jks >> ./android/key.properties

            - name: Build App files
              run: flutter build apk --release --target-platform android-arm64 --build-number ${{github.run_number}}

            - name: Verify Sign
              run: |
                $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify build/app/outputs/flutter-apk/app-release.apk

            - name: Rename APK file
              run: |
                mv build/app/outputs/flutter-apk/app-release.apk "VoidMusic_v${VERSION}+${{github.run_number}}_arm64-v8a_built-on-ubuntu.apk"

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: Release-Android-Ubuntu
                path: |
                  build/app/outputs/flutter-apk/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a_built-on-ubuntu.apk

            - name: Publish Android Ubuntu to Release
              uses: ncipollo/release-action@v1
              with:
                artifacts: |
                  build/app/outputs/flutter-apk/VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a_built-on-ubuntu.apk
                tag: v${{ env.VERSION }}+${{github.run_number}}
                token: ${{ secrets.GITHUB_TOKEN }}
                prerelease: true
                allowUpdates: true
                omitBodyDuringUpdate: true