name: "Build & Release"

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
    
jobs:
    # JOB 1: WINDOWS & ANDROID
    build-windows-android:
        name: Build Windows & Android
        runs-on: windows-latest
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup-Java
              uses: actions/setup-java@v4
              with:
                distribution: 'oracle'
                java-version: '17'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Visual Studio Build Tools
              run: choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"

            - name: Install Inno Setup
              run: choco install innosetup -y

            - name: Setup MSVC environment
              uses: ilammy/msvc-dev-cmd@v1
              with:
                arch: x64

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              shell: powershell
              run: |
                  $vLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
                  if (-not $vLine) { Write-Error 'version not found in pubspec.yaml'; exit 1 }
                  $ver = $vLine.Matches[0].Groups[1].Value.Split('+')[0]
                  echo "VERSION=$ver" >> $env:GITHUB_ENV

            - name: Build Android APK
              run: flutter build apk --release --target-platform android-arm64 --build-number ${{github.run_number}}

            - name: Rename APK file
              shell: powershell
              run: |
                  Rename-Item -Path "build/app/outputs/flutter-apk/app-release.apk" -NewName "VoidMusic_v$env:VERSION+${{github.run_number}}_arm64-v8a.apk"

            - name: Clean Windows build directory
              run: |
                  if (Test-Path "build/windows") { Remove-Item -Recurse -Force "build/windows" }
                  if (Test-Path "build\.flutter-plugins") { Remove-Item -Force "build\.flutter-plugins" }
                  if (Test-Path "build\.flutter-plugins-dependencies") { Remove-Item -Force "build\.flutter-plugins-dependencies" }
                  if (Test-Path "windows\CMakeCache.txt") { Remove-Item -Force "windows\CMakeCache.txt" }
                  if (Test-Path "windows\CMakeFiles") { Remove-Item -Recurse -Force "windows\CMakeFiles" }
                  if (Test-Path "windows\runner\CMakeCache.txt") { Remove-Item -Force "windows\runner\CMakeCache.txt" }
                  if (Test-Path "windows\runner\CMakeFiles") { Remove-Item -Recurse -Force "windows\runner\CMakeFiles" }
              shell: powershell

            - name: Build Windows App
              run: |
                  flutter clean
                  flutter pub get
                  flutter build windows --release --build-number ${{github.run_number}}
              shell: powershell

            - name: Create build-number.txt file
              shell: powershell
              run: |
                  "${{github.run_number}}" | Out-File -FilePath "build-number.txt" -Encoding utf8 -NoNewline

            - name: Create Inno Setup installer
              shell: powershell
              run: |
                  $env:VERSION = "${{ env.VERSION }}"
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVERSION=$env:VERSION windows/installer.iss
              continue-on-error: true

            - name: Copy files to root for upload
              shell: powershell
              run: |
                  # Copy APK - try multiple possible locations
                  $apkSrc = "build/app/outputs/flutter-apk/VoidMusic_v$env:VERSION+${{github.run_number}}_arm64-v8a.apk"
                  if (Test-Path $apkSrc) {
                      Copy-Item $apkSrc -Destination "VoidMusic_v$env:VERSION+${{github.run_number}}_arm64-v8a.apk"
                      Write-Host "APK copied successfully from: $apkSrc"
                  } else {
                      Write-Warning "APK not found at: $apkSrc, searching for any APK..."
                      $anyApk = Get-ChildItem -Path "build/app/outputs/flutter-apk" -Filter "*.apk" -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($anyApk) {
                          Copy-Item $anyApk.FullName -Destination "VoidMusic_v$env:VERSION+${{github.run_number}}_arm64-v8a.apk"
                          Write-Host "APK copied from: $($anyApk.FullName)"
                      } else {
                          Write-Error "No APK found anywhere in build/app/outputs/flutter-apk"
                      }
                  }

                  # Find Windows executable - comprehensive search
                  Write-Host "=== Searching for Windows EXE ==="
                  
                  # Try Release folder first
                  $exeFiles = Get-ChildItem -Path "build/windows/x64/runner/Release" -Filter "*.exe" -ErrorAction SilentlyContinue
                  if ($exeFiles) {
                      Write-Host "Found EXE in Release folder"
                  } else {
                      # Search entire build/windows recursively, excluding installers
                      Write-Host "Not found in Release, searching all of build/windows recursively..."
                      $exeFiles = Get-ChildItem -Path "build/windows" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                                  Where-Object { $_.Name -notmatch "(?i)installer|setup|unins" }
                  }
                  
                  if ($exeFiles) {
                      $winExe = $exeFiles | Select-Object -First 1
                      Write-Host "Found Windows EXE: $($winExe.FullName)"
                      Copy-Item $winExe.FullName -Destination "VoidMusic_v$env:VERSION+${{github.run_number}}.exe"
                  } else {
                      Write-Error "No Windows EXE found anywhere under build/windows"
                  }

                  # Find Inno Setup installer output
                  Write-Host "=== Searching for Inno Setup installer ==="
                  $installerPath = Get-ChildItem -Path "." -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
                                   Where-Object { $_.DirectoryName -match "(?i)Output" -and $_.Name -match "(?i)VoidMusic" } |
                                   Select-Object -First 1 -ExpandProperty FullName
                  if ($installerPath) {
                      Write-Host "Found installer: $installerPath"
                      Copy-Item $installerPath -Destination "VoidMusic_Installer_v$env:VERSION+${{github.run_number}}.exe"
                  } else {
                      Write-Warning "Inno Setup installer not found - this is not critical, continuing."
                  }

            - name: List EXE files in workspace (debug)
              shell: powershell
              run: |
                  Write-Host "=== All .exe files in workspace ==="
                  Get-ChildItem -Path "." -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: Release-Windows-Android
                path: |
                  VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a.apk
                  VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.exe
                  VoidMusic_Installer_v${{ env.VERSION }}+${{github.run_number}}.exe
                  build-number.txt
                if-no-files-found: warn
                overwrite: true

            - name: Create Release
              uses: ncipollo/release-action@v1
              with:
                artifacts: |
                  VoidMusic_v${{ env.VERSION }}+${{github.run_number}}_arm64-v8a.apk
                  VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.exe
                  VoidMusic_Installer_v${{ env.VERSION }}+${{github.run_number}}.exe
                  build-number.txt
                tag: v${{ env.VERSION }}+${{github.run_number}}
                token: ${{ secrets.GITHUB_TOKEN }}
                prerelease: true
                allowUpdates: true
                omitBodyDuringUpdate: true 


    build-linux:
        name: Build Linux
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                flutter-version: '3.35.4'
                channel: 'stable'

            - name: Install Linux Dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

            - name: Install Dependencies
              run: flutter pub get

            - name: Extract version from pubspec.yaml
              run: |
                VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
                echo "VERSION=$VERSION" >> $GITHUB_ENV

            - name: Build Linux App
              run: flutter build linux --release --build-number ${{github.run_number}}

            - name: Find and compress Linux build
              run: |
                echo "=== Searching for Linux build output ==="
                
                # Try to find bundle directory first
                BUNDLE_DIR=$(find build/linux -type d -name "bundle" 2>/dev/null | head -1)
                
                if [ -n "$BUNDLE_DIR" ]; then
                  echo "Bundle directory found: $BUNDLE_DIR"
                  ARCHIVE="VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz"
                  tar -czf "$ARCHIVE" -C "$BUNDLE_DIR" .
                  echo "Archive created: $ARCHIVE"
                  ls -lh "$ARCHIVE"
                else
                  echo "No bundle directory found, trying alternative approach..."
                  
                  # List what's actually in build/linux
                  echo "=== build/linux contents ==="
                  find build/linux -type f 2>/dev/null | head -40
                  
                  # Try to find any executable or main binary
                  LINUX_EXE=$(find build/linux -type f -executable -o -name "void_music" 2>/dev/null | head -1)
                  
                  if [ -n "$LINUX_EXE" ]; then
                    echo "Found Linux executable: $LINUX_EXE"
                    # Get the directory containing the executable
                    EXE_DIR=$(dirname "$LINUX_EXE")
                    ARCHIVE="VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz"
                    tar -czf "$ARCHIVE" -C "$EXE_DIR" .
                    echo "Archive created from executable directory: $ARCHIVE"
                    ls -lh "$ARCHIVE"
                  else
                    # Last resort: archive the entire build/linux directory
                    echo "No executable found, archiving entire build/linux directory"
                    if [ -d "build/linux" ]; then
                      ARCHIVE="VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz"
                      tar -czf "$ARCHIVE" -C build/linux .
                      echo "Archive created from build/linux: $ARCHIVE"
                      ls -lh "$ARCHIVE"
                    else
                      echo "ERROR: build/linux directory does not exist"
                      exit 1
                    fi
                  fi
                fi

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: Release-Linux
                path: VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz
                if-no-files-found: error

            - name: Publish Linux to Release
              uses: ncipollo/release-action@v1
              with:
                artifacts: VoidMusic_v${{ env.VERSION }}+${{github.run_number}}.tar.gz
                tag: v${{ env.VERSION }}+${{github.run_number}}
                token: ${{ secrets.GITHUB_TOKEN }}
                prerelease: true
                allowUpdates: true
                omitBodyDuringUpdate: true